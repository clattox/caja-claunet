<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Caja Beneficio — ClauNet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div class="header-title" id="event-name">🎵 Beneficio</div>
    <div class="header-sub">Caja Rápida · ClauNet</div>
  </div>
  <div class="total-display">
    <div class="total-label">Total venta</div>
    <div class="total-amount" id="total-display">$0</div>
  </div>
</div>

<div id="app">

<!-- TABS -->
<div class="tabs" id="tabs-container"></div>

<!-- GRIDS por categoría -->
<div id="grids-container"></div>

<!-- CARRITO -->
<div id="cart-section" class="cart-section">
  <div class="cart-header">
    <span>🛒 Pedido actual</span>
    <span id="cart-count" style="color:var(--accent)"></span>
  </div>
  <div id="cart-body">
    <div class="cart-empty">Toca un producto para agregar ☝️</div>
  </div>
</div>

<!-- ACCIONES -->
<div class="actions">
  <button class="btn-limpiar" onclick="limpiarCarrito()">🗑️ Limpiar</button>
  <button class="btn-cobrar" id="btn-cobrar" onclick="abrirModal()">✅ Cobrar</button>
</div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" hidden>
  <div class="modal">
    <div class="modal-emoji">🎉</div>
    <div class="modal-title">¡A cobrar!</div>
    <div class="modal-total" id="modal-total"></div>
    <div class="modal-items" id="modal-items"></div>
    <button class="modal-btn-ok" id="btn-confirmar">💵 Cobrado — Nueva venta</button>
    <button class="modal-btn-print" id="btn-imprimir">🖨️ Imprimir ticket</button>
    <button class="modal-btn-cancel" id="btn-volver">← Volver al pedido</button>
  </div>
</div>

<!-- TICKET DE IMPRESIÓN (oculto en pantalla, visible solo al imprimir) -->
<div id="ticket-print">
  <div class="tk-logo" id="tk-logo"></div>
  <div class="tk-meta">
    <span id="tk-num"></span>
    <span id="tk-fecha"></span>
  </div>
  <table class="tk-items" id="tk-items"></table>
  <hr class="tk-sep">
  <div class="tk-total">
    <span>TOTAL</span>
    <span id="tk-total"></span>
  </div>
  <div class="tk-footer">¡Gracias! 🎉<br>ClauNet · caja.claunet.cl</div>
</div>

<script src="config.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
